[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-drift-detector"
version = "0.1.0"
description = "Detect reasoning drift in AI agents — open source, framework-agnostic, integrable with any observability tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mermelada Tech", email = "hola@mermelada.tech"}]
keywords = ["ai-agents", "drift-detection", "observability", "llm", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sentence-transformers>=2.7",
    "prometheus-client>=0.19",
    "click>=8.1",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.0"]
tracepath = []
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
drift-detector = "drift_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
