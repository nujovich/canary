# 🐤 Canary Daily Drift Monitor — Scheduled workflow
#
# Runs every morning to check if your agents degraded overnight.
# Posts a new issue if drift is detected.
#
# Usage:
#   1. Copy this file to .github/workflows/canary-daily.yml
#   2. Add LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY to your repo secrets
#   3. Adjust the schedule and trace-name as needed

name: Canary — Daily Drift Monitor

on:
  schedule:
    - cron: '0 8 * * *'      # Every day at 8am UTC
  workflow_dispatch:           # Manual trigger from GitHub UI

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐤 Check Agent Drift
        id: canary
        uses: nujovich/canary/action@master
        with:
          source: langfuse
          trace-name: BUILD,WATCH,PULSE   # Comma-separated agent names
          hours-back: '24'
          fail-on: degradation_drift
          langfuse-public-key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.LANGFUSE_SECRET_KEY }}

      - name: 📝 Create issue on drift
        if: steps.canary.outputs.drift-detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const report = JSON.parse(`${{ steps.canary.outputs.report-json }}`);
            const driftType = report.drift_type || 'unknown';

            let body = `## 🐤 Daily Drift Alert — ${new Date().toISOString().slice(0,10)}\n\n`;
            body += `**Type:** \`${driftType}\`\n\n`;
            body += `| Detector | Score | Drift? |\n|---|---|---|\n`;
            body += `| Embedding | ${report.embedding_drift.score.toFixed(2)} | ${report.embedding_drift.drifted ? '⚠️' : '✅'} |\n`;
            body += `| Tool Usage | ${report.tool_usage_drift.score.toFixed(2)} | ${report.tool_usage_drift.drifted ? '⚠️' : '✅'} |\n`;
            body += `| Decision Path | ${report.decision_path_drift.score.toFixed(2)} | ${report.decision_path_drift.drifted ? '⚠️' : '✅'} |\n`;
            if (report.llm_judge && report.llm_judge.score != null) {
              body += `| LLM Judge | ${report.llm_judge.score.toFixed(2)}/5 | ${report.llm_judge.alert ? '🔴' : '✅'} |\n`;
            }
            body += `\nRun \`canary check --source langfuse --trace-name BUILD --hours-back 24\` to reproduce locally.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🐤 Canary: ${driftType} detected on ${new Date().toISOString().slice(0,10)}`,
              body: body,
              labels: ['drift', 'canary'],
            });